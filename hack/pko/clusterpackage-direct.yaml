apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: clusterpackage-direct-template
  annotations:
    description: "Deploys EBS Metrics Exporter via Package Operator. Use immutable image tags (git SHA) for production."
parameters:
  - name: OPERATOR_IMAGE
    description: "Application image repository (without tag)"
    required: true
  - name: PKO_IMAGE
    description: "PKO package image repository (without tag)"
    required: true
  - name: IMAGE_TAG
    description: "Image tag (must be immutable/unique, e.g., git SHA)"
    required: true
  - name: REPO_NAME
    description: "ClusterPackage resource name"
    value: ebs-metrics-exporter
objects:
  - apiVersion: package-operator.run/v1alpha1
    kind: ClusterPackage
    metadata:
      name: "${REPO_NAME}"
      annotations:
        package-operator.run/collision-protection: IfNoController
    spec:
      image: ${PKO_IMAGE}:${IMAGE_TAG}
      config:
        image: ${OPERATOR_IMAGE}:${IMAGE_TAG}
