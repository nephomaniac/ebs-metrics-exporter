apiVersion: v1
kind: Template
parameters:
  - name: OPERATOR_IMAGE
    required: true
  - name: PKO_IMAGE
    required: true
  - name: IMAGE_TAG
    required: true
  - name: NAMESPACE
    value: openshift-sre-ebs-metrics
  - name: REPO_NAME
    value: ebs-metrics-exporter
    required: true
  - name: DEVICE
    value: "/dev/nvme1n1"
    required: false
metadata:
  name: clusterpackage-direct-template
objects:
  - apiVersion: package-operator.run/v1alpha1
    kind: ClusterPackage
    metadata:
      name: "${REPO_NAME}"
      annotations:
        package-operator.run/collision-protection: IfNoController
    spec:
      image: ${PKO_IMAGE}:${IMAGE_TAG}
      config:
        image: ${OPERATOR_IMAGE}:${IMAGE_TAG}
        device: ${DEVICE}
