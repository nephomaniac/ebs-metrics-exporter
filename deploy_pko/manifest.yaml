apiVersion: manifests.package-operator.run/v1alpha1
kind: PackageManifest
metadata:
  name: ebs-metrics-exporter
  annotations:
    name: annotation
spec:
  scopes:
  - Cluster
  phases:
  - name: crds
  - name: namespace
  - name: rbac
  - name: reconciler
  - name: deploy
  availabilityProbes:
  - probes:
    # DaemonSets don't have .status.conditions like Deployments
    # Only use fieldsEqual to check readiness
    - fieldsEqual:
        fieldA: .status.numberReady
        fieldB: .status.desiredNumberScheduled
    selector:
      kind:
        group: apps
        kind: DaemonSet
  config:
    openAPIV3Schema:
      type: object
      properties:
        image:
          description: EBS metrics exporter image to deploy (must be immutable tag)
          type: string
          default: ""
